name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create secret files
        run: |
          mkdir -p app/lib
          echo '${{ secrets.HPIWF_SECRETS }}' > app/secrets.json
          echo '${{ secrets.FIREBASE_OPTIONS_FILE }}' | base64 -d > app/lib/firebase_options.dart

      - name: Build Web
        run: |
          cd app
          flutter pub get
          flutter build web --dart-define-from-file=secrets.json
          cat << 'EOF' > build/web/vercel.json
          {
            "cleanUrls": true,
            "rewrites": [
              {
                "source": "/(.*)",
                "destination": "/index.html"
              }
            ]
          }
          EOF

      - name: Deploy to Vercel
        run: |
          npx vercel@latest deploy --prod --token=${{ secrets.VERCEL_TOKEN }} app/build/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}