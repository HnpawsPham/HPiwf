name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create secret files
        run: |
          mkdir -p app/lib
          echo '${{ secrets.HPIWF_SECRETS }}' > app/secrets.json
          echo '${{ secrets.FIREBASE_OPTIONS_FILE }}' | base64 -d > app/lib/firebase_options.dart

      - name: Build Web
        run: |
          cd app
          flutter pub get
          flutter build web --dart-define-from-file=secrets.json
          cp vercel.json build/web/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: app/build/web
          vercel-args: '--prod'